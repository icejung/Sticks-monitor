; ---------------------------------------------------------------------------
;  M5Stack StickS3 (ESP32-S3-PICO-1-N8R8) — 1.14" 135x240 ST7789P3
;  M5Stack 공식 PlatformIO 설정(docs.m5stack.com/en/core/StickS3)을 기준으로 함
;    - StickS3 전용 board 정의는 아직 PlatformIO 메인라인에 없어
;      esp32-s3-devkitc-1 + 수동 플래시/PSRAM 설정으로 빌드한다.
;    - board_build.arduino.memory_type = qio_opi  ← 8MB OPI PSRAM 필수
; ---------------------------------------------------------------------------
[env:m5stack-sticks3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino

; 8MB Flash / 8MB Octal PSRAM
board_build.arduino.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_opi
board_build.filesystem = spiffs

upload_speed = 1500000
monitor_speed = 115200

build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

lib_deps =
    m5stack/M5Unified@^0.3.0
    bblanchon/ArduinoJson@^7.4.2

; 필요하면 시리얼 포트를 고정한다.
; upload_port = /dev/cu.usbmodem101
; monitor_port = /dev/cu.usbmodem101
